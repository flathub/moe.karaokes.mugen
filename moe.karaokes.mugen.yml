        sha256: f7331fcaf5527251b84c8fb84238d06cd2f458422ce950c80e86c72927aa8c2b
  - name: mpv
    buildsystem: meson
    config-opts:
      - '-Dalsa=enabled'
      - '-Dbuild-date=false'
      - '-Dcdda=disabled'
      - '-Dcplayer=true'
      - '-Dcplugins=enabled'
      - '-Dcuda-hwaccel=enabled'
      - '-Dcuda-interop=enabled'
      - '-Ddmabuf-wayland=enabled'
      - '-Ddrm=enabled'
      - '-Ddvbin=disabled'
      - '-Ddvdnav=disabled'
      - '-Degl-drm=enabled'
      - '-Degl-wayland=enabled'
      - '-Degl-x11=enabled'
      - '-Degl=enabled'
