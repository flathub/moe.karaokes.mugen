app-id: moe.karaokes.mugen
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: km-wrapper
separate-locales: false
finish-args:
  - '--filesystem=~/KaraokeMugen:create'
  - '--filesystem=xdg-run/app/com.discordapp.Discord:create'
  - '--filesystem=xdg-run/app/com.discordapp.DiscordCanary:create'
  - '--share=ipc'
  - '--socket=fallback-x11'
  - '--socket=pulseaudio'
  - '--socket=wayland'
  - '--device=all'
  - '--own-name=org.mpris.MediaPlayer2.KaraokeMugen.*'
  - '--talk-name=org.gnome.SessionManager'
  - '--share=network'
  - '--system-talk-name=org.freedesktop.UPower'
  - '--talk-name=com.canonical.AppMenu.Registrar'
  - '--talk-name=com.canonical.dbusmenu'
  - '--talk-name=org.freedesktop.Notifications'
  - '--talk-name=org.kde.StatusNotifierWatcher'
  - '--env=LC_NUMERIC=C'
  - '--env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons'
cleanup:
  - '*.la'
  - '*.a'
modules:
  - name: git
    buildsystem: simple
    build-commands:
      # Copy git from SDK
      - mkdir ${FLATPAK_DEST}/libexec
      - cp -av /usr/bin/git{,-cvsserver,-lfs,-receive-pack,-shell,-upload-archive,-upload-pack} ${FLATPAK_DEST}/bin
      - cp -arv /usr/libexec/git-core ${FLATPAK_DEST}/libexec
      - cp -arv /usr/share/git{-core,web} ${FLATPAK_DEST}/share
  - name: parse-yapp
    buildsystem: simple
    build-commands:
      - perl Makefile.PL INSTALL_BASE=/app
      - make
      - make install
    sources:
      - type: archive
        url: >-
          https://cpan.metacpan.org/authors/id/W/WB/WBRASWELL/Parse-Yapp-1.21.tar.gz
        sha256: 3810e998308fba2e0f4f26043035032b027ce51ce5c8a52a8b8e340ca65f13e5
  - name: libXmu
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxmu.git
        tag: libXmu-1.3.1
        commit: cdf280f6611932f79ab872832974e8043b1cad6d
        x-checker-data:
          type: git
          tag-pattern: ^libXmu-([\d.]+)$
  - name: xclip
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/astrand/xclip.git
        tag: '0.13'
        commit: 9aa7090c3b8b437c6489edca32ae43d82e0c1281
        x-checker-data:
          type: git
          tag-pattern: ^(\d+\.\d+)$
  - name: libXpresent
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxpresent.git
        tag: libXpresent-1.0.2
        commit: 4d92149372461bf575e8a09b1064a2884c38c3aa
        x-checker-data:
          type: git
          tag-pattern: ^libXpresent-([\d.]+)$
  - name: luajit
    no-autogen: true
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: git
        url: https://github.com/LuaJIT/LuaJIT.git
        disable-shallow-clone: true
        commit: 7152e15489d2077cd299ee23e3d51a4c599ab14f
      - type: shell
        commands:
          - sed -i 's|/usr/local|/app|' ./Makefile
  - name: uchardet
    buildsystem: cmake-ninja
    config-opts:
      - '-DCMAKE_BUILD_TYPE=Release'
      - '-DBUILD_STATIC=0'
      - '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: >-
          https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
        sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
        x-checker-data:
          type: html
          url: https://www.freedesktop.org/software/uchardet/releases/
          version-pattern: uchardet-(\d\.\d+\.?\d*).tar.xz
          url-template: >-
            https://www.freedesktop.org/software/uchardet/releases/uchardet-$version.tar.xz
  - name: libass
    cleanup:
      - /include
      - /lib/pkgconfig
    config-opts:
      - '--disable-static'
      - '--enable-asm'
      - '--enable-harfbuzz'
      - '--enable-fontconfig'
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.5
        commit: 4a05d8127f525943ebf45fdc6497c9e665947f0d
        x-checker-data:
          type: git
          tag-pattern: ^(\d\.\d{1,3}\.\d{1,2})$
  - name: zimg
    config-opts:
      - '--disable-static'
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/doc
    sources:
      - type: archive
        archive-type: tar
        url: https://api.github.com/repos/sekrit-twc/zimg/tarball/release-3.0.6
        sha256: 15140e491c4ce9db5f02a038d8a1eb53e9151b55eeed06a2899425a6ebfef367
        x-checker-data:
          type: json
          url: https://api.github.com/repos/sekrit-twc/zimg/releases/latest
          url-query: .tarball_url
          version-query: .tag_name | sub("^release-"; "")
          timestamp-query: .published_at
  - name: Tesseract
    config-opts:
      - '--disable-static'
    modules:
      - name: Leptonica
        config-opts:
          - '--disable-static'
          - '--with-pic'
        sources:
          - type: archive
            url: http://www.leptonica.org/source/leptonica-1.87.0.tar.gz
            sha256: c73363397f96eb1295602bf44d708a994ad42046c791bf03ea0505d829bdb6a7
            x-checker-data:
              type: anitya
              project-id: 1549
              stable-only: true
              url-template: http://www.leptonica.org/source/leptonica-$version.tar.gz
        cleanup:
          - /bin
    sources:
      - type: git
        url: https://github.com/tesseract-ocr/tesseract.git
        tag: 5.5.2
        commit: 6e1d56a847e697de07b38619356550e5cf4e8633
        x-checker-data:
          type: json
          url: https://api.github.com/repos/tesseract-ocr/tesseract/releases/latest
          timestamp-query: .published_at
          tag-query: .tag_name
          version-query: .tag_name
    cleanup:
      - /bin
  - name: ImageMagick
    config-opts:
      - '--disable-static'
      - '--disable-docs'
      - '--with-hdri'
      - '--with-pic'
    sources:
      - type: archive
        url: https://github.com/ImageMagick/ImageMagick/archive/7.1.2-26.tar.gz
        sha256: d63594e334e1c410f600fb9370d78d49e4dc6f315722ca4ba083e864e5c354cb
        x-checker-data:
          type: anitya
          project-id: 1372
          stable-only: true
          url-template: https://github.com/ImageMagick/ImageMagick/archive/$version.tar.gz
    cleanup:
      - /bin
      - /etc
      - /lib/ImageMagick*
      - /share/ImageMagick*
  - name: rubberband
    buildsystem: meson
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://github.com/breakfastquay/rubberband.git
        tag: v4.0.0
        commit: 1d95888bec3ae0a17c0c4af791810d5a63f6bc35
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
  - name: mujs
    buildsystem: autotools
    no-autogen: true
    make-args:
      - release
    make-install-args:
      - prefix=/app
      - install-shared
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
    sources:
      - type: git
        url: https://codeberg.org/ccxvii/mujs.git
        tag: 1.3.8
        commit: 307f18c4216420f2f56e22d8e7040baa39a6304a
        x-checker-data:
          type: git
          url: https://codeberg.org/api/v1/repos/ccxvii/mujs/tags
          tag-pattern: ^([\d.]+)$
      # The unicode character database files are downloaded in the makefile rules `UnicodeData.txt` and `SpecialCasing.txt`.
      # This does not work with flatpak because there is no network access during the build step.
      #
      # TODO: check for updated urls when updating mujs
      - type: file
        url: https://www.unicode.org/Public/16.0.0/ucd/UnicodeData.txt
        sha256: ff58e5823bd095166564a006e47d111130813dcf8bf234ef79fa51a870edb48f
      - type: file
        url: https://www.unicode.org/Public/16.0.0/ucd/SpecialCasing.txt
        sha256: 8d5de354eef79f2395a54c9c7dcebbaf3d30fc962d0f85611ea97aa973a0c451
  - name: nv-codec-headers
    cleanup:
      - '*'
    no-autogen: true
    make-install-args:
      - PREFIX=/app
    sources:
      - type: git
        url: https://github.com/FFmpeg/nv-codec-headers.git
        tag: n13.0.19.0
        commit: e844e5b26f46bb77479f063029595293aa8f812d
        x-checker-data:
          type: git
          tag-pattern: ^n([\d.]+)$
  - name: x264
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
    config-opts:
      - '--disable-cli'
      - '--enable-shared'
    sources:
      - type: git
        url: https://code.videolan.org/videolan/x264.git
        commit: b35605ace3ddf7c1a5d67a2eb553f034aef41d55
  - name: x265
    buildsystem: cmake
    subdir: source
    config-opts:
      - '-DCMAKE_BUILD_TYPE=Release'
      - '-DBUILD_STATIC=0'
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: git
        url: https://bitbucket.org/multicoreware/x265_git.git
        tag: '4.2'
        commit: e444744c03978c1fb4e037168967020cf2648427
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
  - name: libmysofa
    buildsystem: cmake
    config-opts:
      - '-DBUILD_TESTS=OFF'
    sources:
      - type: git
        commit: 7a0c07111a3d7230ec534e08925c24a7525f33c0
        tag: v1.3.4
        url: https://github.com/hoene/libmysofa.git
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
  - name: libbs2b
    buildsystem: autotools
    config-opts:
      - '--disable-static'
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        archive-type: tar
        url: >-
          https://downloads.sourceforge.net/sourceforge/bs2b/libbs2b-3.1.0.tar.gz
        sha256: 6aaafd81aae3898ee40148dd1349aab348db9bfae9767d0e66e0b07ddd4b2528
        x-checker-data:
          type: html
          url: https://sourceforge.net/projects/bs2b/files/libbs2b/
          version-pattern: projects/bs2b/files/libbs2b/(\d+\.\d+\.\d+)
          url-template: >-
            https://downloads.sourceforge.net/sourceforge/bs2b/libbs2b-$version.tar.gz
      - type: shell
        commands:
          - sed -i -e 's/lzma/xz/g' configure.ac
          - autoreconf -vif
  - name: ffmpeg
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/ffmpeg/examples
    config-opts:
      - '--disable-debug'
      - '--disable-doc'
      - '--disable-static'
      - '--enable-encoder=png'
      - '--enable-gnutls'
      - '--enable-gpl'
      - '--enable-shared'
      - '--enable-version3'
      - '--enable-libaom'
      - '--enable-libass'
      - '--enable-libbs2b'
      - '--enable-libdav1d'
      - '--enable-libfreetype'
      - '--enable-libmp3lame'
      - '--enable-libopus'
      - '--enable-libjxl'
      - '--enable-libmysofa'
      - '--enable-libtheora'
      - '--enable-libvorbis'
      - '--enable-libvpx'
      - '--enable-libx264'
      - '--enable-libx265'
      - '--enable-libwebp'
      - '--enable-libxml2'
      - '--enable-vulkan'
      - '--enable-libdrm'
      - '--enable-vaapi'
    post-install:
      - install -d /app/km
      - install -d /app/km/app/
      - install -d /app/km/app/bin
      - mv /app/bin/ffmpeg /app/km/app/bin/ffmpeg
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        commit: 38b88335f99e76ed89ff3c93f877fdefce736c13
        tag: n8.1.2
        x-checker-data:
          type: git
          tag-pattern: ^n([\d.]{3,7})$
  - name: libsixel
    buildsystem: autotools
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
      - type: archive
        archive-type: tar
        url: https://api.github.com/repos/saitoha/libsixel/tarball/v1.8.7-r2
        sha256: 6242586083cc37d898825c25dabd8c7c0abb62fa29ae54edacf2b5eba4db1167
        x-checker-data:
          type: json
          url: https://api.github.com/repos/saitoha/libsixel/releases/latest
          url-query: .tarball_url
          version-query: .tag_name | sub("^v"; "")
          timestamp-query: .published_at
  - name: vapoursynth
    config-opts:
      - '--with-python-prefix=${FLATPAK_DEST}'
    sources:
      - type: archive
        dest-filename: vapoursynth.tar.gz
        url: https://api.github.com/repos/vapoursynth/vapoursynth/tarball/R73 # Lock at 73, starting from 74 the build system changed and needs different build step(s) with python
        sha256: 9c02a68b29eb446b2d0b1be3d831420fdc2bd703aacccc468faef9f94e3bf85f
        x-checker-data:
          type: json
          url: https://api.github.com/repos/vapoursynth/vapoursynth/releases/tags/R73
          version-query: .name
          timestamp-query: .published_at
          url-query: .tarball_url
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - '-Dvulkan=enabled'
      - '-Dshaderc=enabled'
    cleanup:
      - /include
      - /lib/pkgconfig
    sources:
