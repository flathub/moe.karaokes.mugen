      - '-Diconv=enabled'
      - '-Djack=enabled'
      - '-Djavascript=enabled'
      - '-Djpeg=enabled'
      - '-Dlcms2=enabled'
      - '-Dlibarchive=enabled'
      - '-Dlibavdevice=enabled'
      - '-Dlibbluray=disabled'
      - '-Dlibmpv=true'
      - '-Dlua=enabled'
      - '-Dopenal=enabled'
      - '-Dpipewire=enabled'
      - '-Dplain-gl=enabled'
      - '-Dpulse=enabled'
      - '-Drubberband=enabled'
      - '-Duchardet=enabled'
      - '-Dvaapi-drm=enabled'
      - '-Dvaapi-wayland=enabled'
      - '-Dvaapi-x11=enabled'
      - '-Dvaapi=enabled'
      - '-Dvapoursynth=enabled'
      - '-Dvdpau-gl-x11=enabled'
      - '-Dvdpau=enabled'
      - '-Dvector=enabled'
      - '-Dvulkan=enabled'
      - '-Dwayland=enabled'
      - '-Dwerror=false'
      - '-Dx11=enabled'
      - '-Dxv=enabled'
